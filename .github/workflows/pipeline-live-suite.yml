# From orchestration's `examples/stubs/pipeline-live-suite.yml`, kept in step by hand: a
# stub is copied, not tracked, so a change there is a change here or the
# two silently disagree. Oneiroi's edits: the job environment (ci.yml's),
# and no Cloudflare preview lines, since Render builds the preview per PR
# from render.yaml.
# Project stub: live suite.
#
# run-name is load-bearing: "pipeline: live-suite <ticket>" is how the
# control plane correlates this run to its ticket (stale claims, busy
# checks). Set it exactly.
#
# And deliberately NOT that shape when no ticket was given. The plane
# reads runs by name, so a detached run named "pipeline: live-suite "
# would be a half-formed member of the convention rather than a
# non-member. The name below cannot match it at all, which is the honest
# statement: this run is not part of the protocol.
name: pipeline-live-suite
run-name: >-
  ${{ inputs.ticket
      && format('pipeline: live-suite {0}', inputs.ticket)
      || 'live suite (detached, no ticket)' }}

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: >-
          Boundary ticket key. Leave empty to run detached: the suite
          runs and reports nowhere, for when no boundary is open or when
          another marker comment on the same verdict would be noise.
        required: false
        type: string

# Every pipeline command builds a snapshot first, and the snapshot has a
# fixed read-set: the agent run list (actions), the open PRs
# (pull-requests), each PR head's CI verdict (checks), and commit
# ancestry (contents). Those are needed even by a run that only writes a
# comment — the cost of reading the world, not of changing it. A missing
# one surfaces as an HTTP 403 partway through the claim.
permissions:
  contents: read # checkout, and ancestry for the snapshot
  pull-requests: read # the snapshot's open PR list
  actions: read # the snapshot's agent run list, and the CI verdict per PR head
  deployments: read # deploy state, when the project's provider is "github"

jobs:
  live:
    runs-on: ubuntu-latest
    # This job's environment is ci.yml's job environment, because the
    # commands are the same commands: an agent runs the config's
    # qualityGates before it finishes, and the live suite runs the
    # project's test command. Copy ci.yml's `env`/`services` across when
    # either changes (orchestration's stub README records the runs lost
    # to reading this as "toolchain only").
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: oneiroi
      PGPASSWORD: oneiroi
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oneiroi
          POSTGRES_PASSWORD: oneiroi
          POSTGRES_DB: oneiroi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # ---- this project's environment, before the pipeline runs --------
      # ci.yml's setup steps, copied: the BEAM and Node from
      # .tool-versions, and the dependencies of all three mix projects
      # (the client's `npm ci` is inside its own gate line). The
      # Postgres service and PG* env sit on the job above.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: mix deps.get
      - run: mix deps.get
        working-directory: components/daedalus
      - run: mix deps.get
        working-directory: sdk
      # ------------------------------------------------------------------

      # Pin to a pipeline release tag (@v1) once one exists; main while
      # the pipeline itself is under construction (DESIGN §5).
      - uses: SwaggerAllen/orchestration/.github/actions/live-suite@main
        with:
          ticket: ${{ inputs.ticket }}
          # The project's :live-tagged tests: real network, real
          # providers, budget-capped. Once per milestone.
          command: "mix test --only live"
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          github_token: ${{ github.token }}
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
