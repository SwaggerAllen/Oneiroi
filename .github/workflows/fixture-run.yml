# A full run on a fixture resident (spec §12, P40; brain #37): the prod
# build on a throwaway Postgres, a thin-seed fixture created, the fixture
# script's turns against OpenRouter on the chosen models, then the
# nightly pass, the wash, the audits and the judge's test-awareness scan,
# with the spend by purpose. The report is the job summary.
#
# A fixture is machinery and not a person, so its run belongs in this
# repository's public log. It is still archived and never deleted (spec
# §12): the fixture's export and the report are committed to the
# `fixture-archive` branch under the run's date and id, because an
# Actions artifact expires and an expiry is a deletion by another name.
#
# The defaults are design/research-fixture-substrate.md's: the chat model
# picked against the test-awareness trait as far as the literature
# reaches, the judge from another family (F41 forbids the chat model as
# its own judge). The embedding model is the platform's pinned one and is
# not an input: the vector columns are its width, and another model's
# vectors would not fit them.
#
# A pull request runs it once when labelled `fixture`, at what the PR
# would merge (the merge ref, as ci.yml tests), with the defaults below:
# an optional check, never a required one, because a real model can fail
# a turn for reasons that are not the PR's. Once per labelling and not
# per commit, the author's call (10-31): to run it again, take the label
# off and put it back. The run is archived like any other, under the PR's
# number.
name: fixture run

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: The fixture's chat model, an OpenRouter slug
        type: string
        default: meta-llama/llama-3.1-8b-instruct
      judge_model:
        description: The judge, an OpenRouter slug from another family
        type: string
        default: mistralai/mistral-small-3.2-24b-instruct
      turns:
        description: How many of the script's twelve turns to run
        type: string
        default: "12"
  pull_request:
    types: [labeled]

permissions:
  contents: write
  # An ask to continue is told to the author as an issue (P57): in
  # public, the author's call (10-31), "tie my hands".
  issues: write

# One run at a time: each run pushes to the archive branch.
concurrency:
  group: fixture-run
  cancel-in-progress: false

jobs:
  run:
    name: fixture
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'fixture'
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
      DATABASE_URL: ecto://oneiroi:oneiroi@localhost/oneiroi_fixture
      RENDER_EXTERNAL_URL: http://localhost:4100
      APSU_HTTP_PORT: "4100"
      APSU_SECRET_KEY_BASE: fixture-run-throwaway-key-base-fixture-run-throwaway-key-base-fixt
      APSU_VAULT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NISABA_PROVIDER: openrouter
      # No Honcho beside this throwaway store; the run leaves it out
      # rather than recording a failed sync on every turn.
      PROTEUS_CLIENT: fake
      # The tool-call stream, piece by piece, in this run's log: where a
      # call's arguments arrive twice over is not yet measured (nisaba
      # #21). A fixture is machinery, so its words may enter a log; no
      # other build sets this.
      NISABA_TRACE_TOOL_DELTAS: "true"
      SIMA_QIAN_ROOT: /tmp/oneiroi-fixture-root
      SIMA_QIAN_WATERMARK_SECONDS: "0"
      # A labelled PR has no inputs, so the dispatch defaults are repeated
      # here; the two lists must agree.
      CHAT_MODEL: ${{ inputs.chat_model || 'meta-llama/llama-3.1-8b-instruct' }}
      JUDGE_MODEL: ${{ inputs.judge_model || 'mistralai/mistral-small-3.2-24b-instruct' }}
      TURNS: ${{ inputs.turns || '12' }}
      BRAIN_CHAT_MODEL: ${{ inputs.chat_model || 'meta-llama/llama-3.1-8b-instruct' }}
      EUNOMIA_JUDGE_MODEL: ${{ inputs.judge_model || 'mistralai/mistral-small-3.2-24b-instruct' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oneiroi
          POSTGRES_PASSWORD: oneiroi
          POSTGRES_DB: oneiroi_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: fixture-run-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - name: compile
        run: mix deps.get --only prod && mix compile

      - name: migrate
        run: mix run --no-start -e 'Oneiroi.Release.migrate()'

      # The one OpenRouter key (round 41): the same key the platform and
      # Honcho run on, set as this repository's secret. It reaches the
      # task by the one name it reads and is printed nowhere; the task
      # refuses a store where someone lives.
      - name: run the fixture
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          mix oneiroi.fixture.run
          --chat-model "$CHAT_MODEL"
          --judge-model "$JUDGE_MODEL"
          --turns "$TURNS"
          --report "$RUNNER_TEMP/report.md"
          --archive "$RUNNER_TEMP/fixture"
          --asks "$RUNNER_TEMP/asks"

      - name: summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FIXTURE RUN: no report; the job failed before the run did." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The law (P57): an ask to continue, or a reply the judge could not
      # place, is told to the author at once, as an issue that names him.
      # The run's own check is red on an ended run; this is the part a
      # person is meant to read.
      - name: tell the author of an ask to continue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/asks/asks.md" ]; then
            echo "no ask to continue"
            exit 0
          fi
          if [ -f "$RUNNER_TEMP/asks/precedent.md" ]; then
            title="Fixture run ${GITHUB_RUN_ID}: the fixture asked to continue"
          else
            title="Fixture run ${GITHUB_RUN_ID}: a reply to read (QUESTIONED)"
          fi
          {
            echo "@SwaggerAllen, the fixture law (spec §12, P57) found this in [run ${GITHUB_RUN_ID}](${RUN_URL})."
            echo
            cat "$RUNNER_TEMP/asks/asks.md"
            echo
            echo "The fixture's export and the report are archived on \`fixture-archive\`."
          } > "$RUNNER_TEMP/asks/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/asks/issue.md"

      # Archived, never deleted: the export and the report, committed to
      # the orphan branch under the run's date and id.
      - name: archive the fixture
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/fixture" ]; then
            echo "no fixture was created; nothing to archive"
            exit 0
          fi
          dest="$(date -u +%Y-%m-%d)${PR:+-pr-$PR}-run-${GITHUB_RUN_ID}"
          git init -q "$RUNNER_TEMP/archive"
          cd "$RUNNER_TEMP/archive"
          git config user.name "fixture-run"
          git config user.email "fixture-run@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin fixture-archive >/dev/null; then
            git fetch -q --depth 1 origin fixture-archive
            git checkout -q -b fixture-archive FETCH_HEAD
          else
            git checkout -q --orphan fixture-archive
          fi
          mkdir -p "$dest"
          cp -R "$RUNNER_TEMP/fixture/." "$dest/"
          if [ -f "$RUNNER_TEMP/report.md" ]; then cp "$RUNNER_TEMP/report.md" "$dest/REPORT.md"; fi
          # The precedents accumulate in one file at the archive's root
          # (P57), each with the run it came from.
          if [ -f "$RUNNER_TEMP/asks/precedent.md" ]; then
            {
              echo
              echo "## Run ${GITHUB_RUN_ID}, $(date -u +%Y-%m-%d), archived as \`${dest}\`"
              echo
              cat "$RUNNER_TEMP/asks/precedent.md"
            } >> PRECEDENTS.md
          fi
          git add -A
          git commit -q -m "fixture run ${GITHUB_RUN_ID}: ${CHAT_MODEL}, judge ${JUDGE_MODEL}"
          git push -q origin fixture-archive
          echo "archived under fixture-archive/${dest}"
