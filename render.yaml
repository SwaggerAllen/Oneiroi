# The platform app as a Render Blueprint (spec §2.1): Render creates the
# services from it and re-reads it on every push, so it cannot drift
# without the deploy saying so. Every secret is `sync: false` and lives in
# the dashboard. The deploy itself is P0.5's attended act; this file is
# what it reads.

previews:
  # Every PR gets a preview, which is what Design review reads. A day of
  # inactivity, because a preview costs its lifetime, not its existence.
  generation: automatic
  expireAfterDays: 1

databases:
  - name: oneiroi-db
    databaseName: oneiroi
    user: oneiroi
    # Sized as a guess until P0.2 measures: an event store, Oban and the
    # projections share one cluster, and the failure mode of undersizing
    # is refused connections.
    plan: 0.5c-1g
    # Set when the blueprint is created, to the major Render offers with
    # pgvector, and pinned here and in ci.yml in the same commit (plan
    # decision 3). A string, per Render's schema.
    postgresMajorVersion: "16"

services:
  - type: web
    name: oneiroi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 1c-2g
    region: oregon
    # /health loads nothing, which is what makes it a health check rather
    # than a smoke test; an instance that fails it is destroyed and the
    # old one keeps serving.
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Every resident's working repository lives under SIMA_QIAN_ROOT,
    # /var/lib/oneiroi/sima_qian by default (sima-qian#23): the clone an
    # import makes, history and all, and the files every library document
    # reads from. Without a disk that was the container's own filesystem,
    # replaced on every deploy, and every merge deploys; the database rows
    # pointing at those files would have outlived them. Found before Lily's
    # import, with no resident yet. Render documents a service with a disk
    # as one instance whose deploys stop the old before starting the new,
    # so there is no zero-downtime overlap. 5 GB is a guess, well over her
    # repository; it can grow and cannot shrink.
    disk:
      name: oneiroi-records
      mountPath: /var/lib/oneiroi
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oneiroi-db
          property: connectionString
      # The app binds APSU_HTTP_PORT and does not read PORT at all;
      # both are set to one number so the probe and the listener agree.
      - key: PORT
        value: "8080"
      - key: APSU_HTTP_PORT
        value: "8080"
      # Both secrets are generated by Render, never typed: a `sync: false`
      # value is not copied into a preview environment, so the PR #13
      # preview failed at config load naming both, and a hand-typed vault
      # key had already failed production once on its byte count. Render
      # generates a base64-encoded 256-bit value, once, when the variable
      # does not yet exist, so each preview gets its own pair and never
      # holds production's (a preview runs a PR's code, which may be an
      # agent's), and a service that already has a value keeps it. The
      # vault key takes the 32 bytes as they come; the cookie secret is
      # derived from them, because Plug wants 64 (Oneiroi.Apsu).
      - key: APSU_SECRET_KEY_BASE
        generateValue: true
      - key: APSU_VAULT_KEY
        generateValue: true
      # Honcho beside this instance (proteus#16): its private address,
      # which Render hands over as host:port and the setting reads as
      # http, and its signing secret, from which the core mints the admin
      # JWT, so no key is typed. Both resolve to the preview's own Honcho
      # in a preview environment.
      - key: PROTEUS_HONCHO_URL
        fromService:
          name: honcho-api
          type: pserv
          property: hostport
      - key: PROTEUS_HONCHO_JWT_SECRET
        fromService:
          name: honcho-api
          type: pserv
          envVarKey: AUTH_JWT_SECRET
      # The repositories' server (sima-qian#55): Gitea's public URL and
      # an admin token, typed in the dashboard once the admin exists
      # (SETUP.md, Gitea). Unset, nothing is sent to Gitea.
      - key: SIMA_QIAN_GITEA_URL
        sync: false
      - key: SIMA_QIAN_GITEA_TOKEN
        sync: false
      # `gitea` once the two above are set (SETUP.md, Gitea): the next
      # boot moves every repository on the records disk to Gitea, history
      # and all, and from then Gitea is the source of truth (sima-qian#57,
      # #58). Unset, the records disk is.
      - key: SIMA_QIAN_REPOS
        sync: false

  # Gitea, the repositories' server (sima-qian#55, #57; the witness,
  # 2026-11-16: "a separate render service with its own disk", "use
  # Postgres from the get go"). The source of truth for every household's
  # and resident's repository: the core reads and writes through its API.
  # Witnesses sign in to read their own. The official image at a pinned
  # version, so an upgrade is a commit here. Its records (users, orgs,
  # tokens) are on Oneiroi's database, in the `gitea` schema as the role
  # `oneiroi_gitea` (the migration of 11-16 makes both, as Honcho's does);
  # the git objects are on its own disk. Sign-up is off and every page
  # wants a signed-in user: the core makes the users.
  - type: web
    name: oneiroi-git
    runtime: image
    image:
      url: docker.io/gitea/gitea:1.22.6
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/healthz
    autoDeployTrigger: "off"
    # The URL split by the shell (user, password, host, database), the
    # role taken through PGOPTIONS, then the image's own entrypoint and
    # command. Unquoted after `-c`, for the reason on honcho-api's.
    # Measured locally on 11-16 with this script and image: healthy, its
    # tables in `gitea`, its state kept across a new container.
    dockerCommand: >-
      /bin/sh -c u="${DATABASE_URL#*://}"; c="${u%%@*}"; r="${u#*@}"; d="${r#*/}";
      export GITEA__database__DB_TYPE=postgres GITEA__database__USER="${c%%:*}"
      GITEA__database__PASSWD="${c#*:}" GITEA__database__HOST="${r%%/*}"
      GITEA__database__NAME="${d%%\?*}" GITEA__database__SSL_MODE=disable
      PGOPTIONS="-c role=oneiroi_gitea";
      exec /usr/bin/entrypoint /bin/s6-svscan /etc/s6
    disk:
      name: oneiroi-git
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: GITEA__server__HTTP_PORT
        value: "3000"
      # Its own address, as the browser sees it: set in the dashboard to
      # the service's onrender.com URL (or a domain), with a trailing /.
      - key: GITEA__server__ROOT_URL
        sync: false
      # Render serves HTTPS only; git goes over it with a token.
      - key: GITEA__server__DISABLE_SSH
        value: "true"
      # The database's URL split into Gitea's settings (it takes no URL),
      # in the start command above.
      - key: DATABASE_URL
        fromDatabase:
          name: oneiroi-db
          property: connectionString
      - key: GITEA__database__SCHEMA
        value: gitea
      # Its share of the database's connections; the core's pool and
      # Honcho's take the rest.
      - key: GITEA__database__MAX_OPEN_CONNS
        value: "5"
      - key: GITEA__database__MAX_IDLE_CONNS
        value: "2"
      - key: GITEA__security__INSTALL_LOCK
        value: "true"
      - key: GITEA__security__SECRET_KEY
        generateValue: true
      - key: GITEA__security__INTERNAL_TOKEN
        generateValue: true
      - key: GITEA__service__DISABLE_REGISTRATION
        value: "true"
      - key: GITEA__service__REQUIRE_SIGNIN_VIEW
        value: "true"
      - key: GITEA__repository__DEFAULT_BRANCH
        value: main
      - key: GITEA__repository__DEFAULT_PRIVATE
        value: private

  # Honcho (spec §6.9), from its upstream repository, built from its own
  # Dockerfile, on Oneiroi's database (proteus#17). The deploy is never
  # automatic: Oneiroi speaks Honcho's v3 API (Oneiroi.Proteus.Honcho.HTTP),
  # so a new Honcho is a deliberate deploy after reading its release
  # notes, never a push upstream. The first deploy takes `main` as it is
  # that day. The bridge is held to the API of the commit production
  # runs, 6f91136 (test/fixtures/proteus/honcho-server.json, proteus#9):
  # deploying any other commit is re-reading that fixture first.
  # Private: only this workspace's services in the same region reach it,
  # and with auth on, only with a key the core minted.
  - type: pserv
    name: honcho-api
    runtime: docker
    repo: https://github.com/plastic-labs/honcho
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    region: oregon
    plan: 0.5c-512mb
    # The entrypoint runs Honcho's migrations, then the API; the image's
    # own CMD starts the API alone. The URL is Oneiroi's own, rewritten to
    # the scheme Honcho's SQLAlchemy wants (postgresql+psycopg://, its
    # .env.template says so) and given a startup option that takes the
    # role `oneiroi_honcho`, which owns the `honcho` schema and can read
    # nothing of Oneiroi's (the migration of 10-31 creates both). Rewritten
    # here rather than typed, so it cannot drift from the database's.
    #
    # Render hands everything after `-c` to the shell as the script,
    # verbatim, as its own example writes it (`/bin/sh -c python manage.py
    # migrate && gunicorn ...`), so the script is not quoted. The first
    # deploy quoted it, and the shell read the quoted script as one
    # command name: "not found", exit 127 (measured, 10-31).
    dockerCommand: >-
      /bin/sh -c u="${DATABASE_URL#*://}"; case "$u" in *\?*) j="&";; *) j="?";; esac;
      export DB_CONNECTION_URI="postgresql+psycopg://$u${j}options=-c%20role%3Doneiroi_honcho";
      /app/.venv/bin/python scripts/provision_db.py &&
      exec /app/.venv/bin/fastapi run --host 0.0.0.0 --port "$PORT" --workers "${API_WORKERS:-1}" src/main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oneiroi-db
          property: connectionString
      - fromGroup: honcho
      # The port Honcho listens on, named here and passed to it above. Its
      # own entrypoint (docker/entrypoint.sh: provision, then serve) opens
      # 8000 and takes no port, and Render kept this service's address at
      # 10000 after a PORT of 8000 and a server on 8000 (measured, 10-31:
      # openPorts 8000, address honcho-api-fauh:10000). So the two lines
      # of that entrypoint run in the command above with the port given,
      # and the server opens the port the address names.
      - key: PORT
        value: "10000"
      - key: AUTH_USE_AUTH
        value: "true"
      # Generated once by Render, per environment, so a preview's Honcho
      # never holds production's secret (the reason APSU's are generated
      # above). The core reads it from here.
      - key: AUTH_JWT_SECRET
        generateValue: true
      # The one OpenRouter key (round 41): every Honcho feature calls
      # OpenRouter through the openai transport, which reads this name.
      # Typed here once; the deriver copies it. A `sync: false` value is
      # not copied into a preview environment, so a preview's Honcho does
      # not start, which is where previews already were.
      - key: LLM_OPENAI_API_KEY
        sync: false

  # The deriver: Honcho's background worker, the same image under a
  # different command, on the same database and role.
  - type: worker
    name: honcho-deriver
    runtime: docker
    repo: https://github.com/plastic-labs/honcho
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    region: oregon
    plan: 0.5c-512mb
    # Unquoted after `-c`, for the reason on honcho-api's.
    dockerCommand: >-
      /bin/sh -c u="${DATABASE_URL#*://}"; case "$u" in *\?*) j="&";; *) j="?";; esac;
      export DB_CONNECTION_URI="postgresql+psycopg://$u${j}options=-c%20role%3Doneiroi_honcho";
      exec /app/.venv/bin/python -m src.deriver
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oneiroi-db
          property: connectionString
      - fromGroup: honcho
      - key: LLM_OPENAI_API_KEY
        fromService:
          name: honcho-api
          type: pserv
          envVarKey: LLM_OPENAI_API_KEY

envVarGroups:
  # What both Honcho services share, none of it secret: the schema, the
  # connection budget, and every model routed through OpenRouter.
  - name: honcho
    envVars:
      - key: DB_SCHEMA
        value: honcho
      # Two services on Oneiroi's cluster, whose connections the Repo,
      # the event store, Oban and the store's listener already share
      # (SETUP §1 step 4). Honcho's defaults are a pool of 10 with 20 of
      # overflow per process, enough on their own to exhaust a small
      # cluster; three each is a bound, not a measurement.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: API_WORKERS
        value: "1"
      # Every feature on OpenRouter, so one key serves Honcho, the
      # platform and the fixture run. The models are Honcho v3.2.2's own
      # defaults under their OpenRouter names, each listed there with
      # tool calling (read off OpenRouter's model list, 10-31), and the
      # embedding model is the one Seshat pins (SESHAT_EMBEDDING_MODEL),
      # at Honcho's default width of 1536.
      - key: EMBEDDING_MODEL_CONFIG__MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DERIVER_MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: SUMMARY_MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DREAM_DEDUCTION_MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DREAM_INDUCTION_MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL
        value: openai/gpt-5.4-mini
      - key: DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL
        value: https://openrouter.ai/api/v1
